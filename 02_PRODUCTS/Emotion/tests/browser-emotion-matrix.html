<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Emotion — matrice navigateur</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#25343d;background:#faf9f5}
    h1{font-size:24px}.status{padding:12px 14px;border-radius:10px;background:#eef5ee;margin:14px 0}.status.fail{background:#fff0ee;color:#7a3029}
    iframe{width:390px;height:844px;border:1px solid #ccd6d0;border-radius:16px;background:#fff;display:block}
    pre{white-space:pre-wrap;line-height:1.45}.meta{color:#5f7180;font-size:13px}
  </style>
</head>
<body>
  <h1>Matrice navigateur — 41 émotions × 3 intensités</h1>
  <p class="meta">Ce test charge l’application réelle dans un iframe isolé et vérifie la sélection, l’insight, l’exercice et le bouton de poursuite.</p>
  <div id="status" class="status">Test en cours…</div>
  <pre id="results"></pre>
  <iframe id="app" title="Application Emotion — environnement de test" src="../index.html?browser-test=1"></iframe>
  <script>
    const status = document.querySelector('#status');
    const output = document.querySelector('#results');
    const frame = document.querySelector('#app');
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const normalize = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    async function json(path) { const response = await fetch(path); if (!response.ok) throw new Error(`${response.status} ${path}`); return response.json(); }
    async function run() {
      if (location.protocol === 'file:') {
        const message = 'Ce test doit être lancé via HTTP, pas directement en file://. Lance python3 -m http.server 8080 depuis final-simple, puis ouvre cette page avec http://127.0.0.1:8080/tests/browser-emotion-matrix.html.';
        status.textContent = `NON LANCÉ — ${message}`;
        status.classList.add('fail');
        output.textContent = message;
        return;
      }
      const [guidanceData, mapData, exercises] = await Promise.all([
        json('../scientific_knowledge_base/data/emotion_guidance.json'),
        json('../scientific_knowledge_base/data/emotion_exercise_map.json'),
        json('../scientific_knowledge_base/data/exercises.json')
      ]);
      await new Promise((resolve, reject) => { frame.addEventListener('load', resolve, { once: true }); frame.addEventListener('error', () => reject(new Error('iframe impossible à charger')), { once: true }); });
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      for (let attempt = 0; attempt < 50 && !doc.querySelector('#wheelToggle'); attempt++) await wait(100);
      const wheelToggle = doc.querySelector('#wheelToggle');
      if (!wheelToggle) throw new Error('Interface de roue indisponible');
      wheelToggle.click();
      await wait(80);
      const expected = new Map((mapData.mappings || []).map(item => [normalize(item.emotion), item]));
      const exerciseById = new Map(exercises.map(item => [item.id, item.name]));
      const emotions = guidanceData.emotions || [];
      const intensities = [3, 5, 8];
      const failures = [];
      const expectedCases = 41 * intensities.length;
      if (emotions.length !== 41) failures.push(`Base guidée : ${emotions.length} émotions au lieu de 41`);
      let cases = 0;
      for (const intensity of intensities) {
        const level = doc.querySelector(`[data-level="${intensity}"]`);
        if (!level) throw new Error(`Intensité ${intensity} absente`);
        level.click();
        for (const emotion of emotions) {
          const button = [...doc.querySelectorAll('#wheelPanel .interactive-sector, #wheelPanel .extra-emotion')].find(item => normalize(item.dataset.nuance) === normalize(emotion.name));
          if (!button) { failures.push(`${emotion.name} @ ${intensity}: bouton absent`); continue; }
          button.dispatchEvent(new win.MouseEvent('click', { bubbles: true }));
          await wait(0);
          cases += 1;
          const selected = doc.querySelector('.wheel-selection')?.textContent || '';
          const insight = doc.querySelector('#emotionInsight h3')?.textContent || '';
          const exercise = doc.querySelector('#exerciseName')?.textContent || '';
          const continueDisabled = doc.querySelector('#toUnderstand')?.disabled;
          const plan = expected.get(normalize(emotion.name));
          const expectedId = intensity >= 8 ? (plan?.high_intensity_exercise_id || plan?.exercise_id) : plan?.exercise_id;
          const expectedExercise = exerciseById.get(expectedId) || '';
          if (!plan || !expectedExercise) failures.push(`${emotion.name} @ ${intensity}: mapping ou exercice attendu absent`);
          if (!selected.includes(emotion.name)) failures.push(`${emotion.name} @ ${intensity}: sélection affichée « ${selected.trim()} »`);
          if (insight !== `${emotion.name} peut être un signal`) failures.push(`${emotion.name} @ ${intensity}: insight « ${insight} »`);
          if (expectedExercise && exercise !== expectedExercise) failures.push(`${emotion.name} @ ${intensity}: exercice « ${exercise} » attendu « ${expectedExercise} »`);
          if (continueDisabled) failures.push(`${emotion.name} @ ${intensity}: poursuite désactivée`);
        }
      }
      if (cases !== expectedCases) failures.push(`Cas exécutés : ${cases} au lieu de ${expectedCases}`);
      const result = { status: failures.length ? 'failed' : 'passed', cases, expected_cases: expectedCases, emotions: emotions.length, intensities, failures };
      output.textContent = JSON.stringify(result, null, 2);
      status.textContent = failures.length ? `ÉCHEC — ${failures.length} anomalie(s)` : `RÉUSSI — ${cases}/${result.expected_cases} cas vérifiés`;
      status.classList.toggle('fail', Boolean(failures.length));
      return result;
    }
    run().catch(error => { status.textContent = `ÉCHEC — ${error.message}`; status.classList.add('fail'); output.textContent = error.stack || String(error); });
  </script>
</body>
</html>
