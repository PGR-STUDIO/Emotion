<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Emotion — test chiffrement</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#25343d;background:#faf9f5}
    h1{font-size:24px}.status{padding:12px 14px;border-radius:10px;background:#eef5ee;margin:14px 0}.status.fail{background:#fff0ee;color:#7a3029}
    iframe{width:390px;height:844px;border:1px solid #ccd6d0;border-radius:16px;background:#fff;display:block}
    pre{white-space:pre-wrap;line-height:1.45}.meta{color:#5f7180;font-size:13px}
  </style>
</head>
<body>
  <h1>Test navigateur — chiffrement et phrase perdue</h1>
  <p class="meta">Le test utilise uniquement une observation fictive et vérifie le parcours visible de l’application. Il ne lit pas directement le stockage local.</p>
  <div id="status" class="status">Test en cours…</div>
  <pre id="results"></pre>
  <iframe id="app" title="Application Emotion — environnement de test chiffrement" src="../index.html?privacy-test=1"></iframe>
  <script>
    const frame = document.querySelector('#app');
    const status = document.querySelector('#status');
    const output = document.querySelector('#results');
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const doc = () => frame.contentDocument;
    const text = selector => doc().querySelector(selector)?.textContent || '';
    async function waitFor(predicate, timeout = 12000) {
      const end = Date.now() + timeout;
      while (Date.now() < end) { if (predicate()) return; await wait(100); }
      throw new Error('Délai dépassé pendant le test');
    }
    function buttonByText(label) {
      return [...doc().querySelectorAll('button')].find(button => button.textContent.trim() === label);
    }
    function clickButton(label) {
      const button = buttonByText(label);
      if (!button) throw new Error(`Bouton absent : ${label}`);
      button.click();
    }
    async function reloadFrame() {
      await new Promise((resolve, reject) => {
        const onLoad = () => { frame.removeEventListener('error', onError); resolve(); };
        const onError = () => { frame.removeEventListener('load', onLoad); reject(new Error('iframe impossible à charger')); };
        frame.addEventListener('load', onLoad, { once: true });
        frame.addEventListener('error', onError, { once: true });
        frame.contentWindow.location.reload();
      });
      await waitFor(() => Boolean(doc().querySelector('#privacyButton')));
    }
    async function run() {
      if (location.protocol === 'file:') {
        const message = 'Ce test doit être lancé via HTTP, pas directement en file://. Depuis final-simple, lance : python3 -m http.server 8080 puis ouvre http://127.0.0.1:8080/tests/browser-privacy-encryption.html';
        status.textContent = `NON LANCÉ — ${message}`;
        status.classList.add('fail');
        output.textContent = message;
        return;
      }
      await new Promise((resolve, reject) => {
        frame.addEventListener('load', resolve, { once: true });
        frame.addEventListener('error', () => reject(new Error('iframe impossible à charger')), { once: true });
      });
      frame.contentWindow.localStorage.clear();
      await reloadFrame();
      await waitFor(() => Boolean(doc().querySelector('#privacyButton')));
      clickButton('Commencer une observation →');
      await waitFor(() => Boolean(doc().querySelector('#emotionChoices button')));
      clickButton('Calme');
      clickButton('Comprendre cette émotion →');
      await waitFor(() => Boolean(doc().querySelector('#situation')));
      doc().querySelector('#situation').value = 'Test fictif de protection locale';
      doc().querySelector('#situation').dispatchEvent(new Event('input', { bubbles: true }));
      clickButton('Voir l’exercice →');
      clickButton('Passer aux questions →');
      for (let index = 0; index < 6; index += 1) clickButton('Continuer →');
      clickButton('Garder cette observation ✓');
      clickButton('Nouveau');
      clickButton('Voir mes données et les supprimer');
      clickButton('Protéger avec une phrase secrète');
      doc().querySelector('#passphrase').value = 'EmotionTest2026!';
      doc().querySelector('#passphraseConfirm').value = 'EmotionTest2026!';
      clickButton('Valider');
      await waitFor(() => text('#privacyStatus').includes('protégées pour cette session'));
      const protectedSession = true;

      await reloadFrame();
      clickButton('Voir mes données et les supprimer');
      const lockedAfterReload = text('#privacyStatus').includes('Observations protégées');
      clickButton('Déverrouiller mes observations');
      doc().querySelector('#passphrase').value = 'phrase-perdue-inconnue';
      clickButton('Valider');
      await waitFor(() => Boolean(text('#passphraseError')));
      const wrongPhraseRejected = text('#passphraseError').includes('incorrecte') || text('#passphraseError').includes('illisibles');
      doc().querySelector('#passphrase').value = 'EmotionTest2026!';
      clickButton('Valider');
      await waitFor(() => text('#privacyStatus').includes('protégées pour cette session'));
      doc().querySelector('[data-nav="history"]').click();
      await waitFor(() => text('#historyList').includes('Test fictif de protection locale'));
      const correctPhraseRestoredObservation = true;
      doc().querySelector('[data-nav="start"]').click();
      await waitFor(() => Boolean(doc().querySelector('#privacyButton')));
      clickButton('Voir mes données et les supprimer');
      clickButton('Verrouiller maintenant');
      const manuallyLocked = text('#privacyStatus').includes('Observations protégées') && !text('#privacyStatus').includes('pour cette session');
      const result = { status: protectedSession && lockedAfterReload && wrongPhraseRejected && correctPhraseRestoredObservation && manuallyLocked ? 'passed' : 'failed', protectedSession, lockedAfterReload, wrongPhraseRejected, correctPhraseRestoredObservation, manuallyLocked };
      output.textContent = JSON.stringify(result, null, 2);
      status.textContent = result.status === 'passed' ? 'RÉUSSI — protection, rechargement, mauvaise phrase et verrouillage vérifiés' : 'ÉCHEC — voir le détail';
      status.classList.toggle('fail', result.status !== 'passed');
    }
    run().catch(error => { status.textContent = `ÉCHEC — ${error.message}`; status.classList.add('fail'); output.textContent = error.stack || String(error); });
  </script>
</body>
</html>
